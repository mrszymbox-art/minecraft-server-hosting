[package]
name = "hostingg"
version = "0.1.0"
description = "Local Minecraft server manager"
authors = ["HOSTINGG"]
edition = "2021"

[lib]
name = "hostingg_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.4"
tauri-plugin-fs = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json","stream","rustls-tls"] }
tokio = { version = "1", features = ["process","io-util","fs","sync","rt-multi-thread","macros","time"] }
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
